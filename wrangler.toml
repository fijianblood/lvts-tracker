# Cloudflare config for local development and for deploying with the wrangler CLI.
# Deploying from the Cloudflare dashboard instead? You don't need this file; see README.md.

name = "lvts-truck"
main = "worker.js"
compatibility_date = "2025-09-01"

# D1 database. For local dev any id works. To deploy with the CLI, create the database
# (npx wrangler d1 create truck-db) and paste its real database_id here.
[[d1_databases]]
binding = "DB"
database_name = "truck-db"
database_id = "00000000-0000-0000-0000-000000000000"

# Optional: daily clean-up of old points. 15:00 UTC is 3:00 am in Fiji.
[triggers]
crons = ["0 15 * * *"]

# Optional settings (uncomment to change the defaults):
# [vars]
# TIMEZONE = "Pacific/Fiji"
# RETENTION_DAYS = "365"

# Secrets are NOT stored here. Set them with:
#   npx wrangler secret put PHONE_PASSWORD
#   npx wrangler secret put ACCESS_KEY
# For local dev, copy .dev.vars.example to .dev.vars.
